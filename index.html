<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista Compra V7 Firebase</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px}button{margin:4px}.item{display:flex;gap:8px;padding:6px;border-bottom:1px solid #ddd}.done{text-decoration:line-through;color:#777}</style></head><body><h1>🛒 Lista Compra V7 (Firestore)</h1><div><button onclick="newPurchase()">Nueva compra</button><button onclick="importList()">Importar</button></div><textarea id="importArea" style="width:100%;height:120px" placeholder="Pega lista aquí"></textarea><div id="status"></div><div id="list"></div><script type="module">import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';import { getFirestore,doc,setDoc,onSnapshot,getDoc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyDh3o5E8D2de9z90O7BazCrhtnBcczuwmU',authDomain:'lista-compra-kinnamon.firebaseapp.com',projectId:'lista-compra-kinnamon',storageBucket:'lista-compra-kinnamon.firebasestorage.app',messagingSenderId:'978568037635',appId:'1:978568037635:web:6c7f44cf646446f1249536'};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const ref=doc(db,'shoppingLists','current');let items=[];async function save(){await setDoc(ref,{items});}window.newPurchase=async()=>{if(confirm('Borrar compra actual?')){items=[];await save();}};window.importList=async()=>{const txt=document.getElementById('importArea').value.trim();if(!txt)return;const arr=[];let store='Carrefour',cat='Despensa';txt.split(/
/).forEach(l=>{l=l.trim();if(!l)return;if(['CARREFOUR','BM','MERCADONA'].includes(l.toUpperCase())){store=l.charAt(0)+l.slice(1).toLowerCase();if(l==='BM')store='BM';return;}if(!l.includes('→')){if(l.includes('Pescados'))cat='Pescados';else if(l.includes('Carnes'))cat='Carnes';else if(l.includes('Lácteos'))cat='Lácteos y Huevos';else if(l.includes('Verduras'))cat='Verduras';else if(l.includes('Frutas'))cat='Frutas';else if(l.includes('Cereales'))cat='Cereales y Otros';else if(l.includes('Despensa'))cat='Despensa';return;} const p=l.split('→');arr.push({id:crypto.randomUUID(),name:p[0].trim(),detail:p.slice(1).join('→').trim(),store,cat,done:false});});items=arr;await save();};function render(){document.getElementById('status').innerText=`${items.filter(i=>i.done).length}/${items.length} comprados`;document.getElementById('list').innerHTML=items.map(i=>`<div class="item"><input type="checkbox" ${i.done?'checked':''} onchange="toggle('${i.id}')"><span class="${i.done?'done':''}">${i.name} - ${i.detail} [${i.store}]</span><button onclick="editItem('${i.id}')">✏️</button></div>`).join('');}window.toggle=async(id)=>{const x=items.find(i=>i.id===id);x.done=!x.done;await save();};window.editItem=async(id)=>{const x=items.find(i=>i.id===id);const d=prompt('Cantidad/desglose',x.detail);if(d!==null){x.detail=d;await save();}};onSnapshot(ref,s=>{const d=s.data();items=(d&&d.items)||[];render();});</script></body></html>
