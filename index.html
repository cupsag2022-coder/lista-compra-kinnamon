<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="apple-touch-icon" href="apple-touchile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kinnamon"><meta name="theme-color" content="#0f766e"><title>Mi lista de la compra</title><style>
:root{--bg:#f3f7f5;--card:#fff;--text:#17211f;--muted:#687571;--brand:#0f766e;--brand2:#14b8a6;--line:#dbe5e1;--danger:#b42318;--shadow:0 8px 28px #123b3012}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:880px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom))}header{padding:8px 4px}.eyebrow{color:var(--brand);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}h1{font-size:1.8rem;margin:2px 0}.sub,.muted{color:var(--muted)}.sync{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:99px;font-size:.72rem;font-weight:800}.sync.connecting{background:#fff3cd;color:#7a5b00}.sync.ok{background:#dcfce7;color:#166534}.sync.saving{background:#dbeafe;color:#1d4ed8}.sync.error{background:#fee2e2;color:#991b1b}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin:11px 0}.progressRow,.summaryRow{display:flex;justify-content:space-between;gap:10px;font-weight:750}.bar{height:10px;background:#e7efec;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:.25s}.summaryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:#f4f8f7;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.76rem;color:var(--muted)}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px;scrollbar-width:none}.chip,.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:99px;padding:10px 14px;font-weight:750;cursor:pointer;white-space:nowrap}.chip.active,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:7px 0}.cat summary{list-style:none;display:flex;justify-content:space-between;font-weight:850;cursor:pointer;padding:4px}.cat summary::-webkit-details-marker{display:none}.badge{font-size:.75rem;color:var(--brand);background:#e7f5f1;border-radius:99px;padding:4px 8px}.item{display:grid;grid-template-columns:30px 1fr 90px;gap:9px;align-items:start;border-top:1px solid var(--line);padding:13px 3px}.item input{width:23px;height:23px;accent-color:var(--brand)}.name{font-weight:800}.detail{color:var(--muted);font-size:.86rem;margin-top:2px}.breakdown{margin-top:4px;}.breakdownsummary{cursor:pointer;font-weight:700;color:var(--brand);list-style:none;}.breakdown-content{margin-top:8px;padding-left:12px;border-left:3pxsolidvar(--line);}.breakdown-contentdiv{margin:4px0;}.total-highlight{font-weight:800;color:var(--brand);}.qtyedit{border:0;background:transparent;color:inherit;font:inherit;padding:3px 0;text-align:left;cursor:pointer}.qtyedit span{color:var(--brand);font-weight:900}.quickqty{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quickqty button{border:1px solid var(--line);background:#f4f8f7;border-radius:9px;padding:7px 10px;font-weight:750;cursor:pointer}.done .name,.done .detail{text-decoration:line-through;color:#929c99}.store{font-size:.72rem;font-weight:850;padding:4px 7px;border-radius:8px;background:#edf3f1}.iconbtn{border:0;background:transparent;padding:5px;font-size:1rem;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:36px}.fab{position:fixed;right:max(18px,calc((100vw - 880px)/2 + 18px));bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:99px;padding:15px 20px;background:var(--brand);color:#fff;font-weight:850;font-size:1rem;box-shadow:0 10px 28px #0f766e55}.shopping .sub,.shopping #summary,.shopping #tools,.shopping .search,.shopping #pendingLabel,.shopping .store,.shopping .edit{display:none}.shopping h1{font-size:1.45rem}.shopping .item{padding:18px 4px;grid-template-columns:38px 1fr}.shopping .item input{width:30px;height:30px}.shopping .name{font-size:1.12rem}.shopping .detail{font-size:.95rem}.shopping .fab{display:none}dialog{border:0;border-radius:20px;padding:0;width:min(94vw,660px);box-shadow:0 24px 70px #0005}dialog::backdrop{background:#10201dcc}.modal{padding:20px}.modal h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.field textarea{min-height:210px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.hint{font-size:.84rem;color:var(--muted);background:#f2f7f5;padding:10px;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:590px){.toolbar{grid-template-columns:1fr 1fr}.summaryGrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.app{padding-left:9px;padding-right:9px}}
</style></head><body><main class="app" id="app"><header><div class="eyebrow">Compra semanal</div><h1 id="title">🛒 Mi lista de la compra</h1><p class="sub">Carlos + Claudia · sincronización en tiempo real <span id="syncState" class="sync connecting">Conectando…</span></p></header>
<section class="card" id="summary"><div class="progressRow"><span id="progressText"></span><span id="progressPct"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="summaryGrid" id="stats"></div></section>
<section class="card"><div class="filters" id="stores"></div><input id="search" class="search" type="search" placeholder="🔎 Buscar ingrediente…"><label id="pendingLabel"><input type="checkbox" id="pendingOnly"> Mostrar solo pendientes</label></section>
<section class="card toolbar" id="tools"><button class="btn primary" id="newBtn">✨ Nueva compra</button><button class="btn" id="importBtn">📥 Importar lista</button><button class="btn" id="shopBtn">📱 Modo supermercado</button><button class="btn" id="allBtn">✅ Marcar todo</button><button class="btn" id="exportBtn">📤 Copiar pendientes</button><button class="btn" id="undoBtn">↶ Deshacer</button><button class="btn danger" id="resetBtn">♻️ Reiniciar marcas</button></section><div id="list"></div><button class="fab" id="addBtn">＋ Añadir</button></main>
<dialog id="itemDialog"><form class="modal" id="itemForm" onsubmit="return false"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="itemTitle"></h2><button type="button" class="iconbtn" id="closeItem" aria-label="Cerrar">✕</button></div><input type="hidden" id="editId"><div class="field"><label>Ingrediente</label><input id="fName" required></div><div class="row"><div class="field"><label>Cantidad y desglose</label><input id="fDetail" placeholder="250 g (L) + 250 g (X) = 500 g"><div class="quickqty"><button type="button" data-suffix=" g">g</button><button type="button" data-suffix=" kg">kg</button><button type="button" data-suffix=" uds">uds</button><button type="button" id="clearQty">Limpiar</button></div></div><div class="field"><label>Supermercado</label><select id="fStore"><option>Carrefour</option><option>Mercadona</option><option>BM</option></select></div></div><div class="field"><label>Categoría</label><select id="fCat"></select></div><div class="actions"><button type="button" class="btn" id="cancelItem">Cancelar</button><button type="button" class="btn primary" id="saveItem">Guardar</button></div></form></dialog>
<dialog id="importDialog"><form class="modal" id="importForm" onsubmit="return false"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Importar compra completa</h2><button type="button" class="iconbtn" id="closeImport" aria-label="Cerrar">✕</button></div><div class="field"><label>Pega la lista con sus bloques de supermercado</label><textarea id="importText" placeholder="CARREFOUR\n🐟 Pescados\nSalmón → 500 g (L) = 500 g\n\nBM\n🥦 Verduras\nPatata → 300 g (M) = 300 g"></textarea></div><label><input type="checkbox" id="replaceImport" checked> Sustituir la compra actual</label><p class="hint">Detecta CARREFOUR, MERCADONA y BM automáticamente. También reconoce categorías. Las líneas repetidas exactamente no se duplican.</p><div class="actions"><button type="button" class="btn" id="cancelImport">Cancelar</button><button type="button" class="btn primary" id="doImport">Importar todo</button></div></form></dialog>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh3o5E8D2de9z90O7BazCrhtnBcczuwmU",
  authDomain: "lista-compra-kinnamon.firebaseapp.com",
  projectId: "lista-compra-kinnamon",
  storageBucket: "lista-compra-kinnamon.firebasestorage.app",
  messagingSenderId: "978568037635",
  appId: "1:978568037635:web:6c7f44cf646446f1249536"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const shoppingListRef = doc(db, "shoppingLists", "current");

const CATS=[['Pescados','🐟'],['Carnes','🍗'],['Lácteos y Huevos','🥛'],['Verduras','🥦'],['Frutas','🍎'],['Cereales y Otros','🌾'],['Despensa','🧂']], STORES=['Carrefour','Mercadona','BM'];let data=[],filter='Todos',history=[],shopping=false,remoteReady=false;const $=s=>document.querySelector(s),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function snap(){history.push(JSON.stringify(data));if(history.length>25)history.shift()}
function syncState(text,kind){const el=$('#syncState');if(!el)return;el.textContent=text;el.className='sync '+kind}
async function save(){
  render();
  syncState('Guardando…','saving');
  try{
    await setDoc(shoppingListRef,{items:data,updatedAt:serverTimestamp()},{merge:true});
    syncState('Sincronizado','ok');
  }catch(error){
    console.error('Error al guardar en Firestore:',error);
    syncState('Error de sincronización','error');
    alert('No se pudo guardar en Firebase. Revisa la conexión y las reglas de Firestore.');
  }
}
function render(){data.forEach(x=>{if(!CATS.some(([c])=>c===x.cat))x.cat='Despensa';if(!STORES.includes(x.store))x.store='Carrefour'});let q=norm($('#search').value),pending=$('#pendingOnly').checked;$('#stores').innerHTML=['Todos',...STORES].map(s=>`<button class="chip ${filter===s?'active':''}" data-store="${s}">${s==='Todos'?'🛒':s==='Carrefour'?'🔵':s==='Mercadona'?'🟢':'🟠'} ${s}</button>`).join('');let scope=data.filter(x=>filter==='Todos'||x.store===filter),done=scope.filter(x=>x.done).length,pct=scope.length?Math.round(done/scope.length*100):0;$('#progressText').textContent=`${done} de ${scope.length} productos comprados`;$('#progressPct').textContent=pct+'%';$('#fill').style.width=pct+'%';$('#stats').innerHTML=[...STORES,'Total'].map(s=>{let a=s==='Total'?data:data.filter(x=>x.store===s);return `<div class="stat"><b>${a.length}</b><span>${s}<br>${a.filter(x=>!x.done).length} pendientes</span></div>`}).join('');let visible=scope.filter(x=>(!pending||!x.done)&&(!q||norm(x.name+' '+x.detail).includes(q))),html='';CATS.forEach(([cat,icon])=>{let a=visible.filter(x=>x.cat===cat);if(!a.length)return;html+=`<details class="card cat" open><summary><span>${icon} ${cat}</span><span class="badge">${a.filter(x=>x.done).length}/${a.length}</span></summary>${a.map(x=>`<div class="item ${x.done?'done':''}" data-id="${x.id}"><input type="checkbox" ${x.done?'checked':''}><div><div class="name">${esc(x.name)}</div>${(() => {const parsed = parseDetail(x.detail);return `  <div class="detail">    <details class="breakdown">      <summary>        <span class="total-highlight">          ${esc(parsed.total)}        </span>      </summary>      ${        parsed.breakdown.length          ? `            <div class="breakdown-content">              ${parsed.breakdown                .map(line => `<div>${esc(line)}</div>`)                .join('')}            </div>          `          : ''      }      <button        type="button"        class="qtyedit"        title="Editar cantidad"      >        ✎ Editar      </button>    </details>  </div>`;})()}</div><div><span class="store">${esc(x.store)}</span><button class="iconbtn edit" title="Editar">✏️</button><button class="iconbtn delete" title="Eliminar">🗑️</button></div></div>`).join('')}</details>`});$('#list').innerHTML=html||'<div class="card empty">No hay ingredientes con estos filtros.</div>';$('#allBtn').textContent=scope.length&&scope.every(x=>x.done)?'⬜ Desmarcar todo':'✅ Marcar todo';$('#title').textContent=shopping?`🛒 ${filter}`:'🛒 Mi lista de la compra'}
function openItem(x){$('#itemTitle').textContent=x?'Editar ingrediente':'Añadir ingrediente';$('#editId').value=x?.id||'';$('#fName').value=x?.name||'';$('#fDetail').value=x?.detail||'';$('#fStore').value=x?.store||(filter==='Todos'?'Carrefour':filter);let validCat=CATS.some(([c])=>c===x?.cat)?x.cat:'Despensa';$('#fCat').selectedIndex=Math.max(0,CATS.findIndex(([c])=>c===validCat));$('#fCat').value=validCat;if(!$('#fCat').value)$('#fCat').value='Despensa';$('#itemDialog').showModal()}$('#fCat').innerHTML=CATS.map(([c,i])=>`<option value="${c}">${i} ${c}</option>`).join('');$('#stores').onclick=e=>{let b=e.target.closest('[data-store]');if(b){filter=b.dataset.store;if(shopping&&filter==='Todos')filter='Carrefour';render()}};$('#search').oninput=render;$('#pendingOnly').onchange=render;$('#list').onclick=e=>{  let row=e.target.closest('.item');  if(!row)return;  let x=data.find(    v=>v.id===row.dataset.id  );  if(e.target.matches('input')){    snap();    x.done=e.target.checked;    save();  }  else if(    e.target.closest('.edit') ||    e.target.closest('.qtyedit')  ){    openItem(x);  }  else if(    e.target.closest('.delete')  ){    if(      confirm(        `¿Eliminar "${x.name}" de la compra?`      )    ){      snap();      data = data.filter(        item => item.id !== x.id      );      save();    }  }};document.querySelectorAll('[data-suffix]').forEach(b=>b.onclick=()=>{let v=$('#fDetail').value.trim();if(v&&!/(g|kg|uds)$/.test(v))$('#fDetail').value=v+b.dataset.suffix;$('#fDetail').focus()});$('#clearQty').onclick=()=>{$('#fDetail').value='';$('#fDetail').focus()};$('#addBtn').onclick=()=>openItem();$('#saveItem').onclick=e=>{if(!$('#fName').value.trim()){e.preventDefault();return}snap();let old=data.find(x=>x.id===$('#editId').value),obj={id:old?.id||id(),name:$('#fName').value.trim(),detail:$('#fDetail').value.trim(),store:$('#fStore').value,cat:(CATS.some(([c])=>c===$('#fCat').value)?$('#fCat').value:'Despensa'),done:old?.done||false};if(old){old.name=obj.name;old.detail=obj.detail;old.store=obj.store||old.store||'Carrefour';old.cat=CATS.some(([c])=>c===obj.cat)?obj.cat:(old.cat||'Despensa')}else data.push(obj);save();$('#itemDialog').close()};
const closeItem=()=>$('#itemDialog').close();const closeImport=()=>$('#importDialog').close();$('#cancelItem').onclick=closeItem;$('#closeItem').onclick=closeItem;$('#cancelImport').onclick=closeImport;$('#closeImport').onclick=closeImport;[$('#itemDialog'),$('#importDialog')].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));$('#newBtn').onclick=()=>{if(confirm('¿Empezar una compra nueva y borrar la lista actual?')){snap();data=[];save();$('#importDialog').showModal()}};$('#importBtn').onclick=()=>$('#importDialog').showModal();$('#doImport').onclick=e=>{let txt=$('#importText').value.trim();if(!txt){e.preventDefault();return}snap();if($('#replaceImport').checked)data=[];let store='Carrefour',cat='Despensa',added=0,skipped=0;for(let raw of txt.split(/\r?\n/)){let line=raw.replace(/^[-*☐☑✓\s]+/,'').trim();if(!line)continue;let clean=norm(line).replace(/[^a-z]/g,'');let sm=STORES.find(s=>clean===norm(s).replace(/[^a-z]/g,'')||norm(line).includes('lista '+norm(s))||norm(line).includes('🛒 '+norm(s)));if(sm&&!line.includes('→')){store=sm;continue}let cf=CATS.find(([c])=>norm(line).includes(norm(c)));if(cf&&!line.includes('→')){cat=cf[0];continue}if(line.includes('→')){let [name,...r]=line.split('→'),detail=r.join('→').trim(),key=norm(name.trim()+'|'+detail+'|'+store+'|'+cat);if(data.some(x=>norm(x.name+'|'+x.detail+'|'+x.store+'|'+x.cat)===key)){skipped++;continue}data.push({id:id(),name:name.trim(),detail,store,cat,done:false});added++}}$('#importText').value='';save();$('#importDialog').close();setTimeout(()=>alert(`${added} ingredientes importados${skipped?` · ${skipped} duplicados omitidos`:''}`),30)};
$('#shopBtn').onclick=()=>{shopping=!shopping;document.body.classList.toggle('shopping',shopping);if(shopping&&filter==='Todos')filter='Carrefour';$('#shopBtn').textContent=shopping?'↩️ Salir del modo supermercado':'📱 Modo supermercado';$('#pendingOnly').checked=shopping;render()};$('#allBtn').onclick=()=>{let a=data.filter(x=>filter==='Todos'||x.store===filter);if(!a.length)return;snap();let target=!a.every(x=>x.done);a.forEach(x=>x.done=target);save()};$('#resetBtn').onclick=()=>{if(confirm('¿Desmarcar todos los productos?')){snap();data.forEach(x=>x.done=false);save()}};$('#undoBtn').onclick=()=>{if(!history.length)return alert('No hay acciones para deshacer');data=JSON.parse(history.pop());save()};$('#exportBtn').onclick=async()=>{let a=data.filter(x=>!x.done&&(filter==='Todos'||x.store===filter)),out=[`🛒 PENDIENTES${filter==='Todos'?'':' · '+filter}`,''];CATS.forEach(([c,i])=>{let z=a.filter(x=>x.cat===c);if(z.length)out.push(`${i} ${c}`,...z.map(x=>`☐ ${x.name} → ${x.detail}`),'')});let t=out.join('\n');try{await navigator.clipboard.writeText(t);alert('Pendientes copiados')}catch{prompt('Copia la lista:',t)}};

render();
onSnapshot(shoppingListRef,{includeMetadataChanges:true},snapshot=>{
  const payload=snapshot.data();
  data=Array.isArray(payload?.items)?payload.items:[];
  remoteReady=true;
  render();
  syncState(snapshot.metadata.hasPendingWrites?'Guardando…':'Sincronizado',snapshot.metadata.hasPendingWrites?'saving':'ok');
},error=>{
  console.error('Error al escuchar Firestore:',error);
  syncState('Error de sincronización','error');
  document.getElementById('list').innerHTML='<div class="card empty">No se pudo conectar con Firestore. Revisa las reglas y la consola del navegador.</div>';
});

function parseDetail(detail) {
  if (!detail) {
    return {
      total: 'Sin cantidad',
      breakdown: []
    };
  }

  const parts = detail.split('=');

  if (parts.length < 2) {
    return {
      total: detail,
      breakdown: []
    };
  }

  return {
    total: parts[parts.length - 1].trim(),
    breakdown: parts[0]
      .split('+')
      .map(x => x.trim())
      .filter(Boolean)
  };
}
</script></body></html>
